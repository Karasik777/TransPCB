# TransPCB constraint spec.
#
# This is the single source of truth for a board's electrical and fab rules.
# `scripts/apply_constraints.py` translates it into:
#   - KiCad board rules + net classes  (.kicad_pro)
#   - autorouter CLI flags             (route.py / route_diff.py)
#   - verification thresholds          (scripts/check_*.py)
#
# Edit this, never the .kicad_pro rules by hand - the router rewrites those.

board:
  name: esp32c3-devboard
  layers: [F.Cu, B.Cu]

fab:
  vendor: jlcpcb
  tier: standard              # standard | advanced
  min_track_mm: 0.15          # JLC standard floor: 0.127
  min_clearance_mm: 0.15      # JLC standard floor: 0.127
  min_drill_mm: 0.30          # JLC: 0.20 advanced, 0.30 standard
  min_annular_mm: 0.13
  min_hole_to_hole_mm: 0.25
  min_edge_clearance_mm: 0.50
  min_silk_height_mm: 0.80

# Physical stack. REQUIRED if any diff pair declares impedance_ohm - without it
# the router derives width from KiCad defaults that will not match your fab.
# JLCPCB 2-layer 1.6mm: 0.2mm prepreg is not used; core is the full 1.53mm.
stackup:
  layers: 2
  thickness_mm: 1.6
  copper_oz: 1.0              # 1 oz = 0.0348 mm finished
  dielectric:
    core_mm: 1.53
    epsilon_r: 4.5            # FR-4 typical at 1 MHz; ask your fab for the real figure

defaults:
  track_mm: 0.25
  clearance_mm: 0.15
  via:
    size_mm: 0.6
    drill_mm: 0.3

# Optimiser budgets. These become router cost weights, not hard limits -
# the router trades them off against completion.
budgets:
  max_vias: 60                # -> raises --via-cost when the estimate exceeds this
  prefer_straight: true       # -> keeps default --turn-cost 1000
  spread_tracks: false        # -> --track-proximity-cost, helps EMI/DFM
  heuristic_weight: 2.3       # 1.0 = optimal but slow; >1 = faster, longer routes

net_classes:
  power:
    nets: ["VBUS", "+3V3"]
    # Give EITHER a width OR a current - current derives width per IPC-2221
    # and overrides track_mm if both are present.
    current_a: 0.5
    track_mm: 0.40
    max_temp_rise_c: 10
  signal:
    nets: ["IO*", "CC*", "EN", "LED_*", "PWR_LED"]
    track_mm: 0.25

# Routed by route_diff.py BEFORE anything else, and registered as protected
# so the single-ended pass cannot rip them.
diff_pairs:
  - name: USB
    p: USB_DP
    n: USB_DM
    gap_mm: 0.20
    impedance_ohm: 90         # USB 2.0 differential; informational at FS speeds
    max_skew_mm: 2.5          # checked by check_diffpair.py

# Regions that must contain no copper on any layer.
# Do NOT rely on a footprint's own keepout zone - see docs/gotchas.md.
keepouts:
  - name: esp32c3-antenna
    reason: "RF antenna - copper here detunes it"
    rect: {x1: 100.0, y1: 50.0, x2: 130.0, y2: 61.5}   # module pads sit at y=62.0; track width needs the margin

planes:
  - net: GND
    layers: [F.Cu, B.Cu]
    connect_pads: solid       # thermal relief starves small SMD pads
    stitch_pitch_mm: 5.0
    clearance_mm: 0.30

# --- placement optimiser -----------------------------------------------------
# scripts/place_optimise.py refines placement by simulated annealing. It starts
# from your layout and never moves an anchor, so the result stays recognisable.
placement_band: rf            # lf | hf | rf - sets decoupling/crystal limits

placement:
  anchors: ["U*", "J*", "H*", "MH*"]   # never moved: modules, connectors, mounts
  # An anchor on a board edge is fixed for a physical reason - it must stay
  # reachable - but that pins one axis, not two. These let it travel ALONG its
  # edge, which frees space beside starved pins. Override per part in `slide`
  # ('x', 'y', or 'none' to pin completely).
  slide_edge_anchors: true
  edge_tolerance_mm: 3.0
  slide: {}
  move_radius_mm: 8.0                  # how far a part may stray from where you put it
  grid_mm: 0.25
  overlap_margin_mm: 0.15              # inflate courtyards so parts don't pack edge-to-edge

# Cost = weighted sum of these terms. Raise a weight to make the optimiser care
# more about it. Overlap and keepout are deliberately near-fatal.
placement_cost:
  ratsnest_mm:       1.0      # total star-model airwire length - routability proxy
  decap_violation:  50.0      # per mm a decoupling cap sits beyond its band limit
  overlap:         500.0      # per mm^2 of courtyard collision
  keepout:         500.0      # per mm^2 of a part inside a declared keepout
  off_board:      1000.0      # per mm a part hangs off the outline
  connector_edge:   20.0      # per mm a connector sits away from an edge
  area_mm2:          0.5      # penalise sprawl
